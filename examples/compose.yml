# Example: the relay next to Alertmanager on a shared Docker network.
# All values are placeholders. Create the two secret files first, readable
# by the container user (uid 65532), e.g. `chmod 0444 secrets/*`.
services:
  alertmanager-telegram-relay:
    image: ghcr.io/elmoritz/alertmanager-telegram-relay:0.4.1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      WEBHOOK_SECRET_FILE: /run/secrets/relay_webhook_secret
      TELEGRAM_CHAT_IDS: "-1001234567890"
      TELEGRAM_ADMIN_USER_IDS: "123456789"
      # Listen on the container network so Alertmanager can reach it. The
      # port is deliberately not published to the host.
      LISTEN_ADDR: 0.0.0.0:9095
      TIMEZONE: Europe/Berlin
      # Silence buttons; leave out to show only link buttons.
      ALERTMANAGER_URL: http://alertmanager:9093
      GRAFANA_URL: https://grafana.example.com
      # Optional routing (SPEC §7): label matchers => chat[/forum topic].
      # ROUTES: |
      #   team="media" => -1001234567890/42
      # QUIET_SEVERITIES: info
      # QUIET_HOURS: "22:00-07:00"
      # ESCALATE_AFTER: 15m
      # STATUS_BOARD: "true"
      # DIGEST_AT: "08:30"
      # Graph images (SPEC §8): Viewer service-account token; render through an
      # internal address if GRAFANA_URL is a public one behind single sign-on.
      # GRAFANA_TOKEN_FILE: /run/secrets/grafana_token
      # GRAFANA_RENDER_URL: http://grafana:3000
    secrets: [telegram_bot_token, relay_webhook_secret]
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "/relay", "healthcheck"]
      interval: 30s
      timeout: 5s
    networks: [monitoring]

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  relay_webhook_secret:
    file: ./secrets/relay_webhook_secret

volumes:
  relay-data:

networks:
  monitoring:
    external: true
