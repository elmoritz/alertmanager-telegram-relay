# Local Alertmanager for live testing (docs/LIVE-TESTING.md). Sends every
# alert to a relay running on the same machine, with short timings so a test
# run takes seconds, not minutes.
route:
  receiver: relay
  group_by: [alertname, instance]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 2m

receivers:
  - name: relay
    webhook_configs:
      - url: http://127.0.0.1:9095/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            # Relative to the directory this file is in.
            credentials_file: secrets/relay_webhook_secret
